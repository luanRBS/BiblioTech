<header class="header">
    <div class="logo-container">
        <img src="img/logo.png" alt="Logo BiblioTech" class="logo-img">
        <h1>
            <span class="texto-biblio">Biblio</span><span class="texto-tech">Tech</span>
        </h1>
    </div>
    <div class="search">
        <input type="text" id="searchInput" placeholder="Pesquisar Livros">
        <label for="searchInput"><span class="material-symbols-outlined">search</span></label>
    </div>
    <div class="header-actions">
        <a href="#" class="action-item"><span class="material-symbols-outlined">favorite</span><span>Favoritos</span></a>
        <a href="#" class="action-item"><span class="material-symbols-outlined">notifications</span><span>Notificação</span></a>
        <a href="#" class="action-item account-icon"><span class="material-symbols-outlined">account_circle</span></a>
    </div>
</header>

<div class="main-container">
 
           <aside class="sidebar">
            <nav class="sidebar-menu">
                <a routerLink="/home" class="menu-item">
                    <span class="material-symbols-outlined">home</span>
                    <span>Início</span>
                </a>
                <a routerLink="/categorias" class="menu-item">
                    <span class="material-symbols-outlined">grid_view</span>
                    <span>Categorias</span>
                </a>
                <a routerLink="/meus-livros" class="menu-item">
                    <span class="material-symbols-outlined">book_2</span>
                    <span>Meus Livros</span>
                </a>
                <a routerLink="/perfil" class="menu-item">
                    <span class="material-symbols-outlined">person</span>
                    <span>Perfil</span>
                </a>
                <a routerLink="/desafios" class="menu-item">
                    <span class="material-symbols-outlined">workspace_premium</span>
                    <span>Desafios</span>
                </a>
                <a routerLink="/configuracoes" class="menu-item">
                    <span class="material-symbols-outlined">settings</span>
                    <span>Configurações</span>
                </a>
            </nav>
        </aside>

    <main class="content">
        <div class="settings-card">
            <span class="material-symbols-outlined big-gear">settings</span>
            
            <h2 class="settings-title">{{ textos.titulo }}</h2>
    
            <div class="config-row">
                <div class="config-info">
                    <span class="material-symbols-outlined">dark_mode</span>
                    <span class="config-text">{{ textos.modoEscuro }}</span>
                </div>
                
                <label class="switch">
                    <input type="checkbox" id="themeToggle" (change)="alternarModoEscuro($event)">
                    <span class="slider round"></span>
                </label>
            </div>

            <hr class="divisor">

            <div class="config-row">
                <div class="config-info">
                    <span class="material-symbols-outlined">language</span>
                    <span class="config-text">{{ textos.idioma }}</span>
                </div>
                
                <select class="language-select" (change)="mudarIdioma($event)">
                    <option value="pt">Português (BR)</option>
                    <option value="en">English</option>
                    <option value="es">Español</option>
                </select>
            </div>

        </div>
    </main>
</div>

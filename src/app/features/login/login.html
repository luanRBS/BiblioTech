<div class="tela-login-completa">
    <header class="login-header">
        <img src="img/logo.png" alt="Logo BiblioTech" class="logo-img">
        <h1>
            <span class="texto-biblio">Biblio</span><span class="texto-tech">Tech</span>
        </h1>
    </header>


<section class="login-principal">
    <div class="login-card">
        <h2>Login Aluno</h2>

        <div class="input-grupo">
            <label for="matricula">Matricula:</label>
            <input type="text" id="matricula" placeholder="Digite a sua matricula">
        </div>

        <div class="input-grupo">
            <label for="senha">Senha:</label>
            <input type="password" id="senha" placeholder="Digite a sua senha">
        </div>

        <a href="#" class="forgot-password">Esqueci Minha Senha</a>
        <button type="button" class="btn-entrar" (click)="entrar()">Entrar</button>
    </div>
</section>

<footer class="login-features">
    <div class="feature">
        <span class="material-symbols-outlined">verified_user</span>
        <div class="feature-text">
            <strong>Seguro</strong>
            <p>Seus dados protegidos com segurança.</p>
        </div>
    </div>

    <div class="feature">
        <span class="material-symbols-outlined">menu_book</span>
        <div class="feature-text">
            <strong>Pratico</strong>
            <p>Acesse seus materiais de onde estiver.</p>
        </div>

    <div class="feature">
        <span class="material-symbols-outlined">schedule</span>
        <div class="feature-text">
            <strong>Rápido</strong>
            <p>Tudo que você precisa em um só lugar.</p>
        </div>
    </div>    
    </div>
</footer>

</div>
